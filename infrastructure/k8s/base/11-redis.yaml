# Redis for ClinicCare Platform (cache + BullMQ).
# Cache only: ephemeral storage is intentional here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cliniccare
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.2.10-bookworm
          command: ["sh", "-c"]
          args: ["exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly no"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "125m"
          readinessProbe:
            exec:
              command: ["sh", "-c"]
              args: ["redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c"]
              args: ["redis-cli -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cliniccare
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
