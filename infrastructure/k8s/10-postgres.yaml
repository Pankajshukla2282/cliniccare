# PostgreSQL for ClinicCare Platform (dev).
# Uses a PVC so data survives pod restarts on docker-desktop.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: cliniccare
type: Opaque
stringData:
  POSTGRES_DB: "cliniccare"
  POSTGRES_USER: "clinic"
  POSTGRES_PASSWORD: "clinic-change-me"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: cliniccare
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cliniccare
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: "/var/lib/postgresql/data"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cliniccare
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
