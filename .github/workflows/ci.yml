name: ClinicCare CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: cliniccare
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinic -d cliniccare"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://clinic:clinic@localhost:5432/cliniccare
      JWT_SECRET: ci-only-secret-please-replace-1234567890
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run db:generate
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run test:unit
      - run: npm run build:all
      - run: npm audit --audit-level=high
