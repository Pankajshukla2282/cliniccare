# Next.js web config + Deployment + Service.
# The image is built with: docker build -f apps/web/Dockerfile -t cliniccare/web:dev .
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextjs-config
  namespace: cliniccare
data:
  NEXT_PUBLIC_API_URL: "http://api.cliniccare.svc.cluster.local"
  NEXT_PUBLIC_ENV: "development"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cliniccare
  labels:
    app: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: cliniccare/web:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          envFrom:
            - configMapRef:
                name: nextjs-config
            - secretRef:
                name: api-secrets
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "512Mi"
              cpu: "750m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cliniccare
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
