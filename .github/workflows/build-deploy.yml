# Build API + web images, push them to GHCR, render the prod overlay, and
# (optionally) deploy when a cluster kubeconfig is provided.
#
# Secrets required in the repo:
#   - GHCR auth uses the built-in GITHUB_TOKEN (Packages: write).
#   - KUBE_CONFIG_B64 (optional): base64 kubectl kubeconfig for the prod
#     cluster. If present, the deploy job applies the rendered manifests and
#     Prisma migrations run via the api initContainer automatically.

name: Build, push, and deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - app: api
            image: ghcr.io/Pankajshukla2282/cliniccare-api
            dockerfile: apps/api/Dockerfile
            args: ""
          - app: web
            image: ghcr.io/Pankajshukla2282/cliniccare-web
            dockerfile: apps/web/Dockerfile
            args: "NEXT_PUBLIC_API_URL=https://api.cliniccare.example"
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.args }}
          tags: |
            ${{ matrix.image }}:${{ steps.tag.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', matrix.image, github.ref_name) || format('{0}:main', matrix.image) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render:
    name: Render prod manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Render overlay with image tag
        run: |
          kubectl kustomize infrastructure/k8s/overlays/prod --load-restrictor LoadRestrictionsNone \
            | sed "s/__IMAGE_TAG__/${{ needs.build-and-push.outputs.tag }}/g" \
            > cliniccare-prod.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: cliniccare-prod
          path: cliniccare-prod.yaml

  deploy:
    name: Deploy (optional)
    runs-on: ubuntu-latest
    needs: render
    if: ${{ secrets.KUBE_CONFIG_B64 != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cliniccare-prod

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        run: kubectl apply -f cliniccare-prod.yaml

      - name: Wait for rollout
        run: |
          kubectl -n cliniccare rollout status deploy/api --timeout=300s
          kubectl -n cliniccare rollout status deploy/web --timeout=300s