# NestJS API config + Deployment + Service.
# The image is built with: docker build -f apps/api/Dockerfile -t cliniccare/api:dev .
# Deployments run `prisma migrate deploy` in an initContainer before serving
# (the API image ships the Prisma CLI + prisma/migrations for this).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nestjs-config
  namespace: cliniccare
data:
  NODE_ENV: "production"
  PORT: "3000"
  # REDIS_URL/BULLMQ_REDIS_URL are composed from the secret at pod startup.
  REDIS_DB: "0"
  BULLMQ_DEFAULT_TTL: "86400"
  JWT_EXPIRES_IN: "15m"
  BCRYPT_SALT_ROUNDS: "12"
  THROTTLE_TTL_MS: "60000"
  THROTTLE_LIMIT: "100"
  TRUST_PROXY: "1"
  CORS_ORIGIN: "https://app.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cliniccare
  labels:
    app: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies pending Prisma migrations before the API starts serving.
        # Runs once per new pod; idempotent thanks to the migrations table.
        - name: migrate
          image: cliniccare/api:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - npx prisma migrate deploy
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: BULLMQ_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
          envFrom:
            - secretRef:
                name: api-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: logs
          emptyDir: {}
      containers:
        - name: api
          image: cliniccare/api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: BULLMQ_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
          envFrom:
            - configMapRef:
                name: nestjs-config
            - secretRef:
                name: api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: logs
              mountPath: /srv/logs
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "512Mi"
              cpu: "750m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cliniccare
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
