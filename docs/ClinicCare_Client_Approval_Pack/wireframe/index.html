<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinicCare - Client Approval Wireframe</title>
<style>
:root{--blue:#2563eb;--navy:#10233f;--bg:#f5f7fb;--text:#172033;--muted:#64748b;--card:#fff;--border:#e2e8f0;--green:#16a34a;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:#dbeafe;padding:22px 14px;position:fixed;top:0;bottom:0}.logo{font-size:22px;font-weight:800;padding:8px 12px 24px}.logo span{color:#60a5fa}.nav a{display:block;color:#cbd5e1;text-decoration:none;padding:10px 13px;border-radius:9px;margin:3px 0;font-size:14px}.nav a:hover,.nav a.active{background:#1e3a5f;color:#fff}.main{margin-left:245px;width:calc(100% - 245px)}.top{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.crumb{font-weight:700}.user{font-size:13px;color:var(--muted)}.page{padding:26px;max-width:1450px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.pagehead h1{margin:0;font-size:25px}.btn{border:0;border-radius:8px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 2px #00000008}.stat .label,.label{color:var(--muted);font-size:13px}.stat .value{font-size:28px;font-weight:800;margin:7px 0}.stat .delta{font-size:12px;color:var(--green)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);font-size:13px}th{color:var(--muted);font-weight:700}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.info{background:#dbeafe;color:#1d4ed8}.search,.field input,.field select,.field textarea{padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff}.search{width:260px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:90px}.full{grid-column:1/-1}.notice{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;color:#1e40af;font-size:13px;margin-bottom:15px}.empty{text-align:center;color:var(--muted);padding:26px}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:#fff;padding:13px 16px;border-radius:8px;z-index:4}@media(max-width:900px){.side{width:72px}.logo{font-size:0}.logo span{font-size:20px}.nav a{font-size:0;text-align:center}.main{margin-left:72px;width:calc(100% - 72px)}.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:0 16px}.user{display:none}.page{padding:18px}table{display:block;overflow-x:auto;white-space:nowrap}}
</style></head>
<body><div class="app"><aside class="side"><div class="logo">Clinic<span>Care</span></div><nav class="nav"><a href="#dashboard" data-page="dashboard">Dashboard</a><a href="#patients" data-page="patients">Patients</a><a href="#appointments" data-page="appointments">Appointments</a><a href="#consultation" data-page="consultation">Consultation</a><a href="#prescriptions" data-page="prescriptions">Prescriptions</a><a href="#treatments" data-page="treatments">Treatment Courses</a><a href="#labs" data-page="labs">Lab Reports</a><a href="#orders" data-page="orders">Products & Orders</a><a href="#billing" data-page="billing">Billing</a><a href="#reports" data-page="reports">Reports</a><a href="#settings" data-page="settings">Settings</a></nav></aside><main class="main"><header class="top"><div class="crumb" id="crumb">Dashboard</div><div class="user">Dr. Demo User - Clinic Administrator</div></header><section class="page" id="content"></section></main></div><div id="toast" class="toast" hidden></div>
<script>
const seed={patients:[{id:'P-10024',name:'Rahul Sharma',age:42,gender:'Male',phone:'+91 98XXXXXX21',email:'',status:'Active',notes:'Hypertension; no known allergies.'},{id:'P-10025',name:'Anita Verma',age:35,gender:'Female',phone:'+91 97XXXXXX43',email:'',status:'Active',notes:''},{id:'P-10026',name:'Mohan Singh',age:58,gender:'Male',phone:'+91 99XXXXXX67',email:'',status:'Follow-up',notes:''}],appointments:[{id:'A-2001',date:'2026-09-21',time:'09:30',patientId:'P-10024',doctor:'Dr. Mehta',type:'Follow-up',status:'Waiting'},{id:'A-2002',date:'2026-09-21',time:'10:00',patientId:'P-10025',doctor:'Dr. Mehta',type:'New Visit',status:'In Consultation'},{id:'A-2003',date:'2026-09-21',time:'10:30',patientId:'P-10026',doctor:'Dr. Rao',type:'Follow-up',status:'Completed'}],consultations:[],prescriptions:[],treatments:[],labs:[{id:'L-3001',date:'2026-09-18',patientId:'P-10024',test:'CBC',result:'Within reference range',reviewedBy:'Dr. Mehta',status:'Reviewed'},{id:'L-3002',date:'2026-09-12',patientId:'P-10025',test:'Blood Sugar',result:'112 mg/dL',reviewedBy:'Dr. Rao',status:'Pending'}],products:[{id:'PR-1001',name:'Omeprazole 20mg',category:'Medicine',price:120,stock:48,status:'Active'},{id:'PR-1002',name:'Antacid Syrup',category:'Medicine',price:180,stock:22,status:'Active'},{id:'PR-1003',name:'Skin Care Starter Kit',category:'Cosmetics',price:2400,stock:8,status:'Active'}],orders:[],bills:[{id:'INV-1024',patientId:'P-10024',amount:1850,status:'Paid'},{id:'INV-1023',patientId:'P-10025',amount:950,status:'Pending'}],settings:{name:'ClinicCare Demo Clinic',phone:'+91 98XXXXXXXX',address:'Clinic address'}};
const storageKey='cliniccare-wireframe-v2';let db=load();db.products=db.products||structuredClone(seed.products);let selectedPatient='P-10024';let patientQuery='';
function load(){try{return JSON.parse(localStorage.getItem(storageKey))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(storageKey,JSON.stringify(db))}function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function newId(prefix){return prefix+'-'+Date.now().toString().slice(-6)}function getPatient(id){return db.patients.find(p=>p.id===id)||db.patients[0]}function status(value){let cls=['Paid','Completed','Reviewed','Active'].includes(value)?'ok':['Pending','Waiting','Follow-up'].includes(value)?'warn':'info';return `<span class="badge ${cls}">${esc(value)}</span>`}function opts(value){return db.patients.map(p=>`<option value="${p.id}" ${p.id===value?'selected':''}>${esc(p.name)} (${p.id})</option>`).join('')}
function field(label,name,value='',type='text',required=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${required}></div>`}
function queue(rows){return `<table><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th></tr>${rows.map(a=>`<tr><td>${a.time}</td><td>${esc(getPatient(a.patientId).name)}</td><td>${esc(a.doctor)}</td><td>${status(a.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No appointments</td></tr>'}</table>`}
function rows(){let date=document.getElementById('appointment-date')?.value||'2026-09-21',doctor=document.getElementById('appointment-doctor')?.value||'All Doctors';return queue(db.appointments.filter(a=>a.date===date&&(doctor==='All Doctors'||a.doctor===doctor)))}
const pages={
dashboard:()=>{let today=db.appointments.filter(a=>a.date==='2026-09-21');return `<div class="pagehead"><h1>Dashboard</h1><button class="btn" data-go="appointments">New Appointment</button></div><div class="grid"><div class="card stat"><div class="label">Patients Today</div><div class="value">${today.length}</div><div class="delta">Live queue</div></div><div class="card stat"><div class="label">Appointments</div><div class="value">${db.appointments.length}</div><div class="delta">${db.appointments.filter(a=>a.status==='Waiting').length} waiting</div></div><div class="card stat"><div class="label">Pending Bills</div><div class="value">${db.bills.filter(b=>b.status==='Pending').length}</div><div class="delta">Needs attention</div></div><div class="card stat"><div class="label">Revenue Recorded</div><div class="value">â‚¹${db.bills.filter(b=>b.status==='Paid').reduce((s,b)=>s+Number(b.amount),0).toLocaleString('en-IN')}</div><div class="delta">Local ledger</div></div></div><div style="height:18px"></div><div class="grid2"><div class="card"><h3>Today's Queue</h3>${queue(today)}</div><div class="card"><h3>Quick Actions</h3><p><button class="btn secondary" data-go="patient-new">Register Patient</button></p><p><button class="btn secondary" data-go="consultation">Start Consultation</button></p><p><button class="btn secondary" data-go="billing">Create Bill</button></p></div></div>`},
patients:()=>`<div class="pagehead"><h1>Patients</h1><div class="actions"><input class="search" id="patient-search" placeholder="Search patient..." value="${esc(patientQuery)}"><button class="btn" data-go="patient-new">Register Patient</button></div></div><div class="card"><table id="patient-table"><tr><th>Patient ID</th><th>Name</th><th>Age/Gender</th><th>Phone</th><th>Status</th><th>Action</th></tr>${db.patients.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${p.age} / ${esc(p.gender)}</td><td>${esc(p.phone)}</td><td>${status(p.status)}</td><td><button class="btn secondary" data-patient="${p.id}">View</button></td></tr>`).join('')}</table></div>`,
'patient-new':()=>`<div class="pagehead"><h1>Register Patient</h1><button class="btn secondary" data-go="patients">Back</button></div><div class="card"><div class="notice">Saved records remain available in this browser and can be used by the other workflows.</div><form data-form="patient"><div class="formgrid">${field('First Name','firstName','','text','required')}${field('Last Name','lastName')} ${field('Date of Birth','dob','','date')}<div class="field"><label for="gender">Gender</label><select id="gender" name="gender"><option>Female</option><option>Male</option><option>Other</option></select></div>${field('Mobile Number','phone','','tel','required')}${field('Email','email','','email')}${field('Address','address')}${field('Emergency Contact','emergency')}<div class="field full"><label for="notes">Medical Notes</label><textarea id="notes" name="notes"></textarea></div></div><p><button class="btn">Save Patient</button></p></form></div>`,
patient:()=>{let p=getPatient(selectedPatient);return `<div class="pagehead"><h1>Patient: ${esc(p.name)}</h1><div class="actions"><button class="btn secondary" data-go="consultation">Start Consultation</button><button class="btn secondary" data-go="billing">Create Bill</button></div></div><div class="grid"><div class="card"><div class="label">Patient ID</div><b>${p.id}</b></div><div class="card"><div class="label">Age / Gender</div><b>${p.age} / ${esc(p.gender)}</b></div><div class="card"><div class="label">Mobile</div><b>${esc(p.phone)}</b></div><div class="card"><div class="label">Status</div><b>${status(p.status)}</b></div></div><div style="height:18px"></div><div class="grid2"><div class="card"><h3>Clinical History</h3><p>18 Sep 2026 - Acute gastritis; prescription issued.</p><p>02 Aug 2026 - CBC reviewed by Dr. Mehta.</p><p>12 Jul 2026 - Follow-up visit.</p></div><div class="card"><h3>Summary</h3><p>${esc(p.notes||'No medical notes recorded.')}</p><p>Email: ${esc(p.email||'Not recorded')}</p><button class="btn secondary" data-go="appointments">Book Appointment</button></div></div>`},
appointments:()=>`<div class="pagehead"><h1>Appointments & Queue</h1><button class="btn" data-toggle="appointment-form">New Appointment</button></div><div id="appointment-form" class="card" hidden><form data-form="appointment"><div class="formgrid">${field('Date','date','2026-09-21','date','required')}${field('Time','time','11:00','time','required')}<div class="field"><label for="appointment-patient">Patient</label><select id="appointment-patient" name="patientId">${opts(selectedPatient)}</select></div><div class="field"><label for="doctor">Doctor</label><select id="doctor" name="doctor"><option>Dr. Mehta</option><option>Dr. Rao</option></select></div><div class="field"><label for="type">Visit Type</label><select id="type" name="type"><option>New Visit</option><option>Follow-up</option><option>Therapy Session</option></select></div></div><p><button class="btn">Save Appointment</button></p></form></div><div class="card"><div class="actions"><input class="search" type="date" id="appointment-date" value="2026-09-21"><select class="search" id="appointment-doctor"><option>All Doctors</option><option>Dr. Mehta</option><option>Dr. Rao</option></select></div><br><div id="appointment-list">${rows()}</div></div>`,
consultation:()=>`<div class="pagehead"><h1>Consultation</h1><span class="badge info">Clinical encounter</span></div><div class="grid2"><div class="card"><form data-form="consultation"><h3>Clinical Notes</h3><div class="formgrid"><div class="field full"><label for="consult-patient">Patient</label><select id="consult-patient" name="patientId">${opts(selectedPatient)}</select></div><div class="field full"><label for="symptoms">Symptoms</label><textarea id="symptoms" name="symptoms" required>Abdominal discomfort and acidity for 3 days</textarea></div>${field('Diagnosis','diagnosis','Acute gastritis')}${field('Follow-up','followUp','7 days')}<div class="field full"><label for="doctorNotes">Doctor Notes</label><textarea id="doctorNotes" name="doctorNotes"></textarea></div></div><p><button class="btn">Save & Prescribe</button></p></form></div><div class="card"><h3>Patient Snapshot</h3><p><b>Age:</b> ${getPatient(selectedPatient).age}</p><p><b>Notes:</b> ${esc(getPatient(selectedPatient).notes||'None recorded')}</p><p><b>Past Visits:</b> 4</p><button class="btn secondary" data-go="patient">View Full History</button></div></div>`,
prescriptions:()=>`<div class="pagehead"><h1>Prescriptions</h1><button class="btn" data-toggle="prescription-form">New Prescription</button></div><div id="prescription-form" class="card" hidden><form data-form="prescription"><div class="formgrid"><div class="field"><label for="prescription-patient">Patient</label><select id="prescription-patient" name="patientId">${opts(selectedPatient)}</select></div>${field('Medicine','medicine','','text','required')}${field('Dosage','dosage','1')}${field('Timing','timing','After meals')}${field('Duration','duration','7 days')}</div><p><button class="btn">Save Prescription</button></p></form></div><div class="card">${db.prescriptions.length?`<table><tr><th>Date</th><th>Patient</th><th>Medicine</th><th>Dosage</th><th>Duration</th></tr>${db.prescriptions.map(x=>`<tr><td>${x.date}</td><td>${esc(getPatient(x.patientId).name)}</td><td>${esc(x.medicine)}</td><td>${esc(x.dosage)} / ${esc(x.timing)}</td><td>${esc(x.duration)}</td></tr>`).join('')}</table>`:'<div class="empty">No prescriptions yet. Save one from a consultation.</div>'}</div>`,
treatments:()=>`<div class="pagehead"><h1>Treatment Courses</h1><button class="btn" data-toggle="treatment-form">Start Course</button></div><div id="treatment-form" class="card" hidden><form data-form="treatment"><div class="formgrid"><div class="field"><label for="treatment-patient">Patient</label><select id="treatment-patient" name="patientId">${opts(selectedPatient)}</select></div><div class="field"><label for="treatment-type">Course</label><select id="treatment-type" name="type"><option>EECP</option><option>EECP+</option><option>Skin Care</option><option>Metallic Detox</option></select></div>${field('Planned Sessions','sessions','10','number','required')}${field('Start Date','startDate','2026-09-21','date','required')}</div><p><button class="btn">Save Treatment Course</button></p></form></div><div class="card">${db.treatments.length?`<table><tr><th>Course</th><th>Patient</th><th>Sessions</th><th>Start Date</th><th>Status</th></tr>${db.treatments.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(getPatient(x.patientId).name)}</td><td>0 / ${x.sessions}</td><td>${x.startDate}</td><td>${status('Active')}</td></tr>`).join('')}</table>`:'<div class="empty">No active treatment courses.</div>'}</div>`,
labs:()=>`<div class="pagehead"><h1>Lab Reports</h1><button class="btn" data-toggle="lab-form">Add Report</button></div><div id="lab-form" class="card" hidden><form data-form="lab"><div class="formgrid"><div class="field"><label for="lab-patient">Patient</label><select id="lab-patient" name="patientId">${opts(selectedPatient)}</select></div>${field('Test','test','','text','required')}${field('Result','result','','text','required')}<div class="field"><label for="reviewedBy">Reviewed By</label><select id="reviewedBy" name="reviewedBy"><option>Dr. Mehta</option><option>Dr. Rao</option><option>Pending review</option></select></div></div><p><button class="btn">Save Lab Report</button></p></form></div><div class="card"><table><tr><th>Date</th><th>Patient</th><th>Test</th><th>Result</th><th>Reviewed By</th><th>Status</th></tr>${db.labs.map(x=>`<tr><td>${x.date}</td><td>${esc(getPatient(x.patientId).name)}</td><td>${esc(x.test)}</td><td>${esc(x.result)}</td><td>${esc(x.reviewedBy)}</td><td>${status(x.status)}</td></tr>`).join('')}</table></div>`,
orders:()=>`<div class="pagehead"><h1>Products & Orders</h1><button class="btn" data-toggle="order-form">New Order</button></div><div id="order-form" class="card" hidden><form data-form="order"><div class="formgrid"><div class="field"><label for="order-patient">Patient</label><select id="order-patient" name="patientId">${opts(selectedPatient)}</select></div>${field('Product','product','','text','required')}${field('Quantity','quantity','1','number','required')}${field('Amount','amount','0','number','required')}</div><p><button class="btn">Save Order</button></p></form></div><div class="card">${db.orders.length?`<table><tr><th>Order</th><th>Patient</th><th>Product</th><th>Qty</th><th>Amount</th><th>Status</th></tr>${db.orders.map(x=>`<tr><td>${x.id}</td><td>${esc(getPatient(x.patientId).name)}</td><td>${esc(x.product)}</td><td>${x.quantity}</td><td>â‚¹${Number(x.amount).toLocaleString('en-IN')}</td><td>${status(x.status)}</td></tr>`).join('')}</table>`:'<div class="empty">No product orders yet.</div>'}</div>`,
billing:()=>`<div class="pagehead"><h1>Billing</h1><button class="btn" data-toggle="bill-form">New Bill</button></div><div id="bill-form" class="card" hidden><form data-form="bill"><div class="formgrid"><div class="field"><label for="bill-patient">Patient</label><select id="bill-patient" name="patientId">${opts(selectedPatient)}</select></div>${field('Amount','amount','800','number','required')}<div class="field"><label for="bill-status">Payment Status</label><select id="bill-status" name="status"><option>Pending</option><option>Paid</option></select></div></div><p><button class="btn">Save Bill</button></p></form></div><div class="card"><table><tr><th>Invoice</th><th>Patient</th><th>Amount</th><th>Status</th><th>Action</th></tr>${db.bills.map(x=>`<tr><td>${x.id}</td><td>${esc(getPatient(x.patientId).name)}</td><td>â‚¹${Number(x.amount).toLocaleString('en-IN')}</td><td>${status(x.status)}</td><td>${x.status==='Pending'?`<button class="btn secondary" data-pay="${x.id}">Record Payment</button>`:'Paid'}</td></tr>`).join('')}</table></div>`,
reports:()=>`<div class="pagehead"><h1>Reports & Analytics</h1><button class="btn secondary" data-export="report">Export CSV</button></div><div class="grid"><div class="card stat"><div class="label">Total Visits</div><div class="value">${db.appointments.length}</div></div><div class="card stat"><div class="label">Revenue</div><div class="value">â‚¹${db.bills.reduce((s,b)=>s+Number(b.amount),0).toLocaleString('en-IN')}</div></div><div class="card stat"><div class="label">New Patients</div><div class="value">${db.patients.length}</div></div><div class="card stat"><div class="label">Outstanding</div><div class="value">â‚¹${db.bills.filter(b=>b.status==='Pending').reduce((s,b)=>s+Number(b.amount),0).toLocaleString('en-IN')}</div></div></div><div style="height:18px"></div><div class="card"><h3>Workflow Coverage</h3><table><tr><th>Domain</th><th>Records</th><th>Next action</th></tr><tr><td>Patients</td><td>${db.patients.length}</td><td>Book an appointment</td></tr><tr><td>Clinical</td><td>${db.consultations.length} consultations, ${db.prescriptions.length} prescriptions</td><td>Start consultation</td></tr><tr><td>Commerce</td><td>${db.orders.length} orders, ${db.bills.length} invoices</td><td>Record payment</td></tr></table></div>`,
settings:()=>`<div class="pagehead"><h1>Settings</h1></div><div class="grid2"><div class="card"><h3>Clinic Profile</h3><form data-form="settings"><div class="formgrid">${field('Clinic Name','name',db.settings.name)}${field('Phone','phone',db.settings.phone)}<div class="field full"><label for="address">Address</label><textarea id="address" name="address">${esc(db.settings.address)}</textarea></div></div><p><button class="btn">Save Changes</button></p></form></div><div class="card"><h3>Access & Security</h3><p>Organization-scoped roles: owner, admin, receptionist, doctor, nurse, billing.</p><p>Tenant: <b>demo.cliniccare.local</b></p><button class="btn danger" data-reset="store">Reset demo data</button></div></div>`};
pages.products=()=>`<div class="pagehead"><h1>Product Management</h1><button class="btn" data-toggle="product-form">Add Product</button></div><div id="product-form" class="card" hidden><form data-form="product"><div class="formgrid">${field('Product Name','productName','','text','required')}${field('Category','category','Medicine','','required')}${field('Price','price','0','number','required')}${field('Stock','stock','0','number','required')}</div><p><button class="btn">Save Product</button></p></form></div><div class="card"><table><tr><th>Product ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr>${db.products.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>Rs ${Number(p.price).toLocaleString('en-IN')}</td><td>${p.stock}</td><td>${status(p.status)}</td><td><button class="btn danger" data-product-delete="${p.id}">Archive</button></td></tr>`).join('')}</table></div>`;
pages.roles=()=>`<div class="pagehead"><h1>Roles & Access Demo</h1></div><div class="grid2"><div class="card"><h3>Role Permission Matrix</h3><table><tr><th>Role</th><th>Patients</th><th>Clinical</th><th>Billing</th><th>Admin</th></tr>${[['Owner','Full','Full','Full','Full'],['Receptionist','Read/write','Read','Read','None'],['Doctor','Read/write','Full','Read','None'],['Nurse','Read','Treatment','None','None'],['Billing','Read','None','Full','None']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</table></div><div class="card"><h3>Assign Demo Role</h3><form data-form="role"><div class="field"><label for="role-user">Staff member</label><select id="role-user" name="user"><option>Meera Reception</option><option>Dr. Mehta</option><option>Ravi Billing</option><option>Neha Nurse</option></select></div><div class="field"><label for="role-name">Role</label><select id="role-name" name="role"><option>Receptionist</option><option>Doctor</option><option>Billing</option><option>Nurse</option><option>Owner</option></select></div><p><button class="btn">Assign Role</button></p></form><div id="role-message" class="notice" hidden></div></div></div>`;
function money(value){return 'Rs '+Number(value).toLocaleString('en-IN')}
function go(page){location.hash=page}function toast(message){let el=document.getElementById('toast');el.textContent=message;el.hidden=false;setTimeout(()=>el.hidden=true,2200)}function render(){let page=location.hash.slice(1)||'dashboard';if(!pages[page])page='dashboard';document.getElementById('content').innerHTML=pages[page]();document.getElementById('crumb').textContent=page.replace('-', ' ').replace(/\b\w/g,c=>c.toUpperCase());document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));if(page==='patients')filterPatients(patientQuery)}function filterPatients(q){patientQuery=q;document.querySelectorAll('#patient-table tr:not(:first-child)').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'')}
document.addEventListener('click',e=>{let goEl=e.target.closest('[data-go]');if(goEl)return go(goEl.dataset.go);let toggle=e.target.closest('[data-toggle]');if(toggle){let el=document.getElementById(toggle.dataset.toggle);if(el)el.hidden=!el.hidden}let p=e.target.closest('[data-patient]');if(p){selectedPatient=p.dataset.patient;go('patient')}let pay=e.target.closest('[data-pay]');if(pay){let bill=db.bills.find(x=>x.id===pay.dataset.pay);if(bill){bill.status='Paid';save();render();toast('Payment recorded')}}let reset=e.target.closest('[data-reset]');if(reset&&confirm('Reset all local demo data?')){db=structuredClone(seed);save();render();toast('Demo data reset')}let exp=e.target.closest('[data-export]');if(exp){let csv=[['Invoice','Patient','Amount','Status'],...db.bills.map(b=>[b.id,getPatient(b.patientId).name,b.amount,b.status])].map(r=>r.join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='cliniccare-report.csv';a.click();toast('Report exported')}});document.addEventListener('input',e=>{if(e.target.id==='patient-search')filterPatients(e.target.value);if(e.target.id==='appointment-date'||e.target.id==='appointment-doctor')document.getElementById('appointment-list').innerHTML=rows()});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f).entries());if(f.dataset.form==='patient'){let record={id:newId('P'),name:(d.firstName+' '+d.lastName).trim(),age:d.dob?new Date().getFullYear()-new Date(d.dob).getFullYear():0,gender:d.gender,phone:d.phone,email:d.email,status:'Active',notes:d.notes||''};if(!record.name||!record.phone)return toast('Name and mobile number are required');db.patients.push(record);selectedPatient=record.id;save();toast('Patient registered');go('patient')}else if(f.dataset.form==='appointment'){db.appointments.push({id:newId('A'),date:d.date,time:d.time,patientId:d.patientId,doctor:d.doctor,type:d.type,status:'Waiting'});selectedPatient=d.patientId;save();toast('Appointment booked');go('appointments')}else if(f.dataset.form==='consultation'){db.consultations.push({id:newId('C'),date:'2026-09-21',patientId:d.patientId,diagnosis:d.diagnosis,symptoms:d.symptoms});selectedPatient=d.patientId;save();toast('Consultation saved');go('prescriptions')}else if(f.dataset.form==='prescription'){db.prescriptions.push({id:newId('RX'),date:'2026-09-21',patientId:d.patientId,medicine:d.medicine,dosage:d.dosage,timing:d.timing,duration:d.duration});selectedPatient=d.patientId;save();toast('Prescription released');go('prescriptions')}else if(f.dataset.form==='treatment'){db.treatments.push({id:newId('TR'),patientId:d.patientId,type:d.type,sessions:d.sessions,startDate:d.startDate});save();toast('Treatment course started');go('treatments')}else if(f.dataset.form==='lab'){db.labs.push({id:newId('L'),date:'2026-09-21',patientId:d.patientId,test:d.test,result:d.result,reviewedBy:d.reviewedBy,status:d.reviewedBy==='Pending review'?'Pending':'Reviewed'});save();toast('Lab report saved');go('labs')}else if(f.dataset.form==='order'){db.orders.push({id:newId('ORD'),patientId:d.patientId,product:d.product,quantity:d.quantity,amount:d.amount,status:'Pending'});save();toast('Order created');go('orders')}else if(f.dataset.form==='bill'){db.bills.push({id:newId('INV'),patientId:d.patientId,amount:d.amount,status:d.status});save();toast('Invoice created');go('billing')}else if(f.dataset.form==='settings'){db.settings={name:d.name,phone:d.phone,address:d.address};save();toast('Clinic profile saved');render()}});window.addEventListener('hashchange',render);render();
</script><script>
function ensureExtraNav(){const nav=document.querySelector('.nav');if(!nav||nav.querySelector('[data-page="products"]'))return;nav.insertAdjacentHTML('beforeend','<a href="#products" data-page="products">Product Management</a><a href="#roles" data-page="roles">Roles & Access</a>')}
function fixCurrency(){const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(node=>{if(node.nodeValue.includes('â‚¹'))node.nodeValue=node.nodeValue.replaceAll('â‚¹','Rs ')})}
ensureExtraNav();fixCurrency();window.addEventListener('hashchange',()=>{setTimeout(()=>{ensureExtraNav();fixCurrency()},0)});
document.addEventListener('click',event=>{const deleteButton=event.target.closest('[data-product-delete]');if(deleteButton&&confirm('Archive this product?')){const product=db.products.find(item=>item.id===deleteButton.dataset.productDelete);if(product){product.status='Archived';save();render();toast('Product archived')}}});
document.addEventListener('submit',event=>{const form=event.target;if(form.dataset.form==='product'){event.preventDefault();const data=Object.fromEntries(new FormData(form).entries());db.products.push({id:newId('PR'),name:data.productName,category:data.category,price:Number(data.price),stock:Number(data.stock),status:'Active'});save();toast('Product added');go('products')}if(form.dataset.form==='role'){event.preventDefault();const data=Object.fromEntries(new FormData(form).entries());const message=document.getElementById('role-message');if(message){message.textContent=data.user+' is now assigned the '+data.role+' role for the demo organization.';message.hidden=false}toast('Role assigned')}});
</script></body></html>
