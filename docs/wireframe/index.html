<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinicCare — Hospital Digital Operations Demo</title>
<style>
:root{--nav:#132238;--nav2:#1b2f49;--teal:#0f8b8d;--teal2:#dff5f4;--green:#2e8b57;--orange:#d98725;--red:#bd4e4e;--bg:#f4f7fa;--card:#fff;--text:#172333;--muted:#657487;--line:#dfe6ed;--shadow:0 8px 28px rgba(18,34,56,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--nav),#0e1a29);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:800;padding:8px 12px 18px}.brand small{display:block;font-size:10px;color:#9fb2c8;margin-top:3px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#cbd7e4;padding:9px 12px;border-radius:8px;margin:2px 0}.nav button:hover,.nav button.active{background:#26415f;color:#fff}.nav .group{font-size:10px;text-transform:uppercase;color:#8297ad;padding:14px 12px 5px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10}.top .grow{flex:1}.context{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.context select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff}.content{padding:22px;max-width:1500px;margin:auto}.h1{font-size:27px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px}.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.dark{background:var(--nav);color:#fff;border-color:var(--nav)}.btn.danger{color:#a33;border-color:#e5b8b8}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:16px}.metric{font-size:28px;font-weight:800}.label{color:var(--muted);font-size:12px}.trend{font-size:11px;color:var(--green);margin-top:5px}.card h3{margin:0 0 9px;font-size:16px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;white-space:nowrap}.table th{background:#f7f9fb;color:#5d6b7a}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#eef2f5;color:#536273;font-size:10px}.badge.good{background:#e7f5ed;color:#257446}.badge.warn{background:#fff1dd;color:#995d10}.badge.red{background:#fdeaea;color:#a33}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px}.hero{background:linear-gradient(120deg,#12314d,#0f8b8d);color:#fff;border-radius:15px;padding:24px;box-shadow:var(--shadow)}.hero h2{margin:0;font-size:28px}.hero p{color:#d8eff0;max-width:800px}.kpi{display:flex;justify-content:space-between;gap:10px}.progress{height:7px;background:#e8edf2;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal)}.list{display:grid;gap:8px}.item{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.muted{color:var(--muted)}.right{text-align:right}.modal{position:fixed;inset:0;background:rgba(10,22,35,.55);display:none;align-items:center;justify-content:center;z-index:30}.modal.show{display:flex}.modalbox{background:#fff;border-radius:12px;width:min(680px,94vw);max-height:90vh;overflow:auto;padding:20px}.modalbox h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:11px;color:var(--muted);display:grid;gap:5px}.formgrid input,.formgrid select,.formgrid textarea{padding:8px;border:1px solid var(--line);border-radius:7px}.span2{grid-column:span 2}.notice{padding:10px;border-radius:8px;background:var(--teal2);color:#145c5d;font-size:12px}.money{font-weight:800}.funnel{display:flex;gap:5px;align-items:end;height:130px}.funnel div{flex:1;background:#dff5f4;border:1px solid #bde5e4;border-radius:6px 6px 0 0;text-align:center;padding-top:8px;font-size:11px}.small{font-size:11px}.toast{position:fixed;right:20px;bottom:20px;background:var(--nav);color:#fff;padding:11px 14px;border-radius:8px;display:none;z-index:50}.toast.show{display:block}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.nav{grid-template-columns:1fr 1fr}.g4,.g3,.g2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">ClinicCare<small>Hospital Digital Operations Demo</small></div>
  <div class="nav" id="nav"></div>
</aside>
<main class="main">
  <div class="top">
    <div class="context">
      <select id="env"></select><select id="tenant"></select><select id="clinic"></select><select id="role"></select>
    </div>
    <div class="grow"></div>
    <input id="globalSearch" class="search" style="max-width:360px" placeholder="Search patients, appointments, invoices...">
    <button class="btn" onclick="openModal('quick')">Quick action</button>
  </div>
  <div id="content" class="content"></div>
</main>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox" id="modalbox"></div></div>
<div id="toast" class="toast"></div>
<script>
'use strict';

const NAV = [
 ['OVERVIEW','Dashboard','dashboard'],
 ['PATIENT JOURNEY','Patients','patients'],['PATIENT JOURNEY','Appointments & Queue','appointments'],['PATIENT JOURNEY','Leads & Follow-ups','leads'],['PATIENT JOURNEY','Reviews & Engagement','reviews'],
 ['CLINICAL','Patient Profile','profile'],['CLINICAL','Consultations','consultations'],['CLINICAL','Prescriptions','prescriptions'],['CLINICAL','Medical Records','records'],['CLINICAL','Laboratory','labs'],['CLINICAL','Teleconsultation','tele'],['CLINICAL','Treatments & Packages','treatments'],['CLINICAL','Documents & Consents','documents'],['CLINICAL','Skin Care','skincare'],
 ['REVENUE','Billing & Payments','billing'],['REVENUE','Orders & Cart','orders'],['REVENUE','Products & Inventory','inventory'],['REVENUE','Services Catalog','services'],
 ['PEOPLE & CONTROL','Doctors & Schedules','doctors'],['PEOPLE & CONTROL','Organizations & Clinics','organizations'],['PEOPLE & CONTROL','Users & RBAC','users'],['PEOPLE & CONTROL','Notifications','notifications'],
 ['CONTENT & INSIGHTS','CMS','cms'],['CONTENT & INSIGHTS','Reports & Search','reports'],['CONTENT & INSIGHTS','Audit & Idempotency','audit'],['CONTENT & INSIGHTS','Tenant & Environment','tenantEnv']
];

const ROLES={
 SUPER_ADMIN:['*'], ADMIN:['dashboard','patients','appointments','profile','consultations','prescriptions','records','labs','tele','treatments','documents','skincare','billing','orders','inventory','services','doctors','organizations','users','notifications','cms','reports','audit','tenantEnv','leads','reviews'],
 DOCTOR:['dashboard','patients','appointments','profile','consultations','prescriptions','records','labs','tele','treatments','documents','skincare','notifications','reports'],
 NURSE:['dashboard','patients','appointments','profile','records','labs','treatments','documents','notifications'],
 RECEPTIONIST:['dashboard','patients','appointments','leads','reviews','profile','notifications'],
 BILLING:['dashboard','patients','billing','orders','inventory','services','reports','notifications'],
 LAB:['dashboard','patients','labs','records','notifications'],
 MARKETING:['dashboard','leads','reviews','cms','reports','notifications']
};

const seed={
 development:{
  tenants:[
   {id:'t1',name:'ClinicCare Demo Hospital',slug:'cliniccare-demo'},
   {id:'t2',name:'Aarogyam Multi-Speciality',slug:'aarogyam'}
  ],
  clinics:[
   {id:'c1',tenantId:'t1',name:'Main Hospital',city:'Nagpur'},
   {id:'c2',tenantId:'t1',name:'City OPD Centre',city:'Nagpur'},
   {id:'c3',tenantId:'t2',name:'Aarogyam Central',city:'Pune'}
  ],
  patients:[
   {id:'p1',tenantId:'t1',clinicId:'c1',name:'Rahul Sharma',phone:'98xxxx1122',service:'Dermatology',status:'ACTIVE',last:'2026-09-20',value:18500},
   {id:'p2',tenantId:'t1',clinicId:'c1',name:'Anita Verma',phone:'98xxxx2211',service:'Aesthetic',status:'ACTIVE',last:'2026-09-19',value:9200},
   {id:'p3',tenantId:'t1',clinicId:'c2',name:'Vikram Singh',phone:'97xxxx3322',service:'General OPD',status:'FOLLOW-UP',last:'2026-09-15',value:4300},
   {id:'p4',tenantId:'t2',clinicId:'c3',name:'Neha Patil',phone:'96xxxx4433',service:'Wellness',status:'ACTIVE',last:'2026-09-21',value:12700}
  ],
  appointments:[
   {id:'a1',tenantId:'t1',clinicId:'c1',patient:'Rahul Sharma',doctor:'Dr. Mehta',time:'10:00',status:'WAITING',amount:1500},
   {id:'a2',tenantId:'t1',clinicId:'c1',patient:'Anita Verma',doctor:'Dr. Rao',time:'10:30',status:'CONFIRMED',amount:2500},
   {id:'a3',tenantId:'t1',clinicId:'c2',patient:'Vikram Singh',doctor:'Dr. Singh',time:'11:15',status:'CONFIRMED',amount:1000},
   {id:'a4',tenantId:'t2',clinicId:'c3',patient:'Neha Patil',doctor:'Dr. Joshi',time:'12:00',status:'CONFIRMED',amount:1800}
  ],
  invoices:[
   {id:'i1',tenantId:'t1',clinicId:'c1',patient:'Rahul Sharma',amount:12500,status:'PAID'},
   {id:'i2',tenantId:'t1',clinicId:'c1',patient:'Anita Verma',amount:6200,status:'PENDING'},
   {id:'i3',tenantId:'t1',clinicId:'c2',patient:'Vikram Singh',amount:4300,status:'PAID'},
   {id:'i4',tenantId:'t2',clinicId:'c3',patient:'Neha Patil',amount:12700,status:'PENDING'}
  ],
  leads:[
   {id:'l1',tenantId:'t1',name:'Priya Kulkarni',source:'Website',stage:'NEW',value:8000},
   {id:'l2',tenantId:'t1',name:'Sanjay Rao',source:'Referral',stage:'BOOKED',value:15000},
   {id:'l3',tenantId:'t2',name:'Kavita Shah',source:'Campaign',stage:'NEW',value:12000}
  ],
  users:[
   {id:'u1',name:'Platform Admin',tenantId:'t1',clinicId:'c1',role:'SUPER_ADMIN'},
   {id:'u2',name:'Dr. Mehta',tenantId:'t1',clinicId:'c1',role:'DOCTOR'},
   {id:'u3',name:'Reception Team',tenantId:'t1',clinicId:'c1',role:'RECEPTIONIST'},
   {id:'u4',name:'Billing Team',tenantId:'t1',clinicId:'c1',role:'BILLING'},
   {id:'u5',name:'Aarogyam Admin',tenantId:'t2',clinicId:'c3',role:'ADMIN'}
  ],
  memberships:[
   {userId:'u1',tenantId:'t1',clinicId:'c1',role:'SUPER_ADMIN'},{userId:'u1',tenantId:'t2',clinicId:'c3',role:'SUPER_ADMIN'},
   {userId:'u2',tenantId:'t1',clinicId:'c1',role:'DOCTOR'},{userId:'u3',tenantId:'t1',clinicId:'c1',role:'RECEPTIONIST'},
   {userId:'u4',tenantId:'t1',clinicId:'c1',role:'BILLING'},{userId:'u5',tenantId:'t2',clinicId:'c3',role:'ADMIN'}
  ],
  audit:[], idempotency:[]
 }
};

function deepClone(x){return JSON.parse(JSON.stringify(x))}
function key(){return 'cliniccare-demo-'+state.env}
let state={env:localStorage.getItem('cc.env')||'development',tenantId:null,clinicId:null,role:null,page:'dashboard',query:'',data:null};
function loadEnv(){
 const saved=localStorage.getItem(key());
 state.data=saved?JSON.parse(saved):deepClone(seed[state.env]||seed.development);
 state.tenantId=localStorage.getItem('cc.tenant')||state.data.tenants[0]?.id;
 if(!state.data.tenants.some(t=>t.id===state.tenantId)) state.tenantId=state.data.tenants[0]?.id;
 const cs=state.data.clinics.filter(c=>c.tenantId===state.tenantId);
 state.clinicId=localStorage.getItem('cc.clinic')||cs[0]?.id;
 if(!cs.some(c=>c.id===state.clinicId)) state.clinicId=cs[0]?.id;
 const m=state.data.memberships.filter(x=>x.tenantId===state.tenantId && (!x.clinicId||x.clinicId===state.clinicId));
 state.role=localStorage.getItem('cc.role')||m[0]?.role||'SUPER_ADMIN';
 if(!m.some(x=>x.role===state.role)) state.role=m[0]?.role||'SUPER_ADMIN';
 persist(); syncContext();
}
function persist(){localStorage.setItem(key(),JSON.stringify(state.data));localStorage.setItem('cc.env',state.env);localStorage.setItem('cc.tenant',state.tenantId||'');localStorage.setItem('cc.clinic',state.clinicId||'');localStorage.setItem('cc.role',state.role||'')}
function syncContext(){
 const e=document.getElementById('env'),t=document.getElementById('tenant'),c=document.getElementById('clinic'),r=document.getElementById('role');
 e.innerHTML=['development','staging','production'].map(x=>`<option ${x===state.env?'selected':''}>${x}</option>`).join('');
 t.innerHTML=state.data.tenants.map(x=>`<option value="${x.id}" ${x.id===state.tenantId?'selected':''}>${x.name}</option>`).join('');
 c.innerHTML=state.data.clinics.filter(x=>x.tenantId===state.tenantId).map(x=>`<option value="${x.id}" ${x.id===state.clinicId?'selected':''}>${x.name}</option>`).join('');
 const roles=[...new Set(state.data.memberships.filter(x=>x.tenantId===state.tenantId && (!x.clinicId||x.clinicId===state.clinicId)).map(x=>x.role))];
 r.innerHTML=roles.map(x=>`<option ${x===state.role?'selected':''}>${x}</option>`).join('');
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
}
function activePatients(){return state.data.patients.filter(x=>x.tenantId===state.tenantId && (!state.clinicId||x.clinicId===state.clinicId))}
function activeAppointments(){return state.data.appointments.filter(x=>x.tenantId===state.tenantId && (!state.clinicId||x.clinicId===state.clinicId))}
function activeInvoices(){return state.data.invoices.filter(x=>x.tenantId===state.tenantId && (!state.clinicId||x.clinicId===state.clinicId))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function can(page){return state.role==='SUPER_ADMIN'||ROLES[state.role]?.includes(page)||ROLES[state.role]?.includes('*')}
function go(page){state.page=page;state.query='';render()}
function navRender(){let last='';const n=document.getElementById('nav');n.innerHTML='';NAV.forEach(([group,label,page])=>{if(group!==last){const d=document.createElement('div');d.className='group';d.textContent=group;n.appendChild(d);last=group}const b=document.createElement('button');b.dataset.page=page;b.textContent=label;b.onclick=()=>go(page);n.appendChild(b)});syncContext()}
function metric(label,val,note){return `<div class="card"><div class="label">${label}</div><div class="metric">${val}</div><div class="trend">${note||''}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function shell(title,sub,body,actions=''){return `<div class="h1">${title}</div><div class="sub">${sub}</div><div class="actions">${actions}</div>${body}`}
function dashboard(){
 const ps=activePatients(), ap=activeAppointments(), inv=activeInvoices(), revenue=inv.filter(x=>x.status==='PAID').reduce((a,x)=>a+x.amount,0), pending=inv.filter(x=>x.status!=='PAID').reduce((a,x)=>a+x.amount,0);
 return `<div class="hero"><h2>Hospital command centre</h2><p>ClinicCare connects patient acquisition, appointments, clinical care, diagnostics, billing, inventory and follow-up into one operational view.</p><div class="actions"><button class="btn" onclick="go('patients')">Open patient journey</button><button class="btn" onclick="go('reports')">View business intelligence</button><button class="btn" onclick="go('tenantEnv')">Show tenant controls</button></div></div>
 <div class="grid g4" style="margin-top:14px">${metric('Active patients',ps.length,'Connected patient context')}${metric("Today's appointments",ap.length,'Queue + schedule')}${metric('Collected',money(revenue),'Paid invoices')}${metric('Outstanding',money(pending),'Collection opportunity')}</div>
 <div class="grid g3" style="margin-top:14px">
 <div class="card"><h3>Revenue opportunity</h3><div class="kpi"><span>Pending collection</span><b>${money(pending)}</b></div><div class="progress" style="margin-top:10px"><i style="width:${Math.min(100,(revenue/(revenue+pending||1))*100)}%"></i></div><p class="small muted">Use billing, reminders and follow-ups to reduce leakage.</p></div>
 <div class="card"><h3>Patient funnel</h3><div class="funnel"><div style="height:100%">Leads<br><b>${state.data.leads.filter(x=>x.tenantId===state.tenantId).length}</b></div><div style="height:80%">Booked<br><b>${ap.length}</b></div><div style="height:65%">Visited<br><b>${Math.max(0,ap.length-1)}</b></div><div style="height:48%">Follow-up<br><b>${ps.filter(x=>x.status==='FOLLOW-UP').length}</b></div></div></div>
 <div class="card"><h3>Operational alerts</h3><div class="list"><div class="item">3 follow-ups due today <span class="badge warn">ACTION</span></div><div class="item">2 pending invoices <span class="badge red">REVENUE</span></div><div class="item">Queue has ${ap.filter(x=>x.status==='WAITING').length} waiting <span class="badge">OPS</span></div></div></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Cross-functional workflow</h3><p class="muted">Lead → Appointment → Consultation → Prescription/Lab → Treatment → Invoice/Payment → Follow-up → Review.</p><div class="notice">Each step can become measurable, role-aware and auditable.</div></div><div class="card"><h3>Why hospitals care</h3><p>Less operational friction, clearer accountability, better patient experience and more visibility into revenue opportunities.</p></div></div>`;
}
function patients(){
 const rows=activePatients().filter(x=>!state.query||`${x.name} ${x.phone} ${x.service}`.toLowerCase().includes(state.query.toLowerCase())).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.service)}</td><td>${x.status}</td><td>${money(x.value)}</td><td><button class="btn" onclick="profile('${x.id}')">Profile</button></td></tr>`);
 return shell('Patients','360° patient context across front office, clinical and revenue workflows',`<div class="card"><input id="patientSearch" class="search" placeholder="Search patients..." value="${esc(state.query)}"><div id="patientTable" style="margin-top:10px">${table(['Patient','Phone','Service','Status','Lifetime value','Action'],rows)}</div></div>`);
}
function profile(id){const p=state.data.patients.find(x=>x.id===id);state.selectedPatient=id;go('profile')}
function profilePage(){const p=state.data.patients.find(x=>x.id===state.selectedPatient)||activePatients()[0];if(!p)return '<div class="card">No patient in this context.</div>';return shell('Patient Profile',`${p.name} • unified patient journey`, `<div class="grid g3">${metric('Lifetime value',money(p.value),'Revenue relationship')}${metric('Visits','8','Example demo history')}${metric('Follow-up','Due','Engagement opportunity')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Clinical timeline</h3><div class="list"><div class="item">Consultation completed <span class="badge good">DONE</span></div><div class="item">Prescription issued <span class="badge good">DONE</span></div><div class="item">Lab report uploaded <span class="badge">RECORD</span></div><div class="item">Follow-up scheduled <span class="badge warn">DUE</span></div></div></div><div class="card"><h3>Financial timeline</h3><div class="list"><div class="item">Package purchased <b>${money(12000)}</b></div><div class="item">Invoice paid <span class="badge good">PAID</span></div><div class="item">Next recommended service <span class="badge warn">OPPORTUNITY</span></div></div></div></div>`)}
function appointments(){const rows=activeAppointments().map(a=>`<tr><td>${a.time}</td><td>${a.patient}</td><td>${a.doctor}</td><td><span class="badge ${a.status==='WAITING'?'warn':'good'}">${a.status}</span></td><td>${money(a.amount)}</td><td><button class="btn" onclick="toast('Queue action recorded')">Check-in</button></td></tr>`);return shell('Appointments & Queue','Reduce waiting, coordinate teams and protect doctor capacity',`<div class="grid g3">${metric('Waiting',activeAppointments().filter(a=>a.status==='WAITING').length,'Front-office queue')}${metric('Confirmed',activeAppointments().filter(a=>a.status==='CONFIRMED').length,'Scheduled')}${metric('Potential value',money(activeAppointments().reduce((a,x)=>a+x.amount,0)),'Today')}</div><div class="card" style="margin-top:14px">${table(['Time','Patient','Doctor','Status','Value','Action'],rows)}</div>`)}
function generic(title,sub,features){return shell(title,sub,`<div class="grid g3">${features.map(([h,b,c])=>`<div class="card"><h3>${h}</h3><p>${b}</p><span class="badge ${c||''}">DEMO FUNCTIONALITY</span></div>`).join('')}</div>`)}
function billing(){const rows=activeInvoices().map(i=>`<tr><td>${i.id}</td><td>${i.patient}</td><td>${money(i.amount)}</td><td><span class="badge ${i.status==='PAID'?'good':'warn'}">${i.status}</span></td><td><button class="btn" onclick="markPaid('${i.id}')">Collect</button></td></tr>`);return shell('Billing & Payments','Turn completed care into visible, collectible revenue',`<div class="grid g3">${metric('Collected',money(activeInvoices().filter(x=>x.status==='PAID').reduce((a,x)=>a+x.amount,0)),'Paid')}${metric('Outstanding',money(activeInvoices().filter(x=>x.status!=='PAID').reduce((a,x)=>a+x.amount,0)),'Follow-up')}${metric('Invoices',activeInvoices().length,'Current scope')}</div><div class="card" style="margin-top:14px">${table(['Invoice','Patient','Amount','Status','Action'],rows)}</div>`)}
function markPaid(id){const i=state.data.invoices.find(x=>x.id===id);if(i){i.status='PAID';audit('PAYMENT_CAPTURED',id);persist();render();toast('Payment captured once and audited')}}
function audit(action,ref){state.data.audit.push({id:Date.now(),tenantId:state.tenantId,clinicId:state.clinicId,action,ref,at:new Date().toISOString()});persist()}
function reports(){const ps=activePatients(), inv=activeInvoices(), paid=inv.filter(x=>x.status==='PAID').reduce((a,x)=>a+x.amount,0), pending=inv.filter(x=>x.status!=='PAID').reduce((a,x)=>a+x.amount,0);return shell('Reports & Search','Decision support for operations, growth and revenue',`<div class="grid g4">${metric('Patients',ps.length,'Active context')}${metric('Revenue',money(paid),'Collected')}${metric('Pipeline',money(state.data.leads.filter(x=>x.tenantId===state.tenantId).reduce((a,x)=>a+x.value,0)),'Lead value')}${metric('Collection gap',money(pending),'Opportunity')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Management questions</h3><div class="list"><div class="item">Which services generate the most value?</div><div class="item">Where do patients drop from lead to visit?</div><div class="item">Which invoices need follow-up?</div><div class="item">Which clinics/roles have operational bottlenecks?</div></div></div><div class="card"><h3>Executive view</h3><p>Use the demo metrics as a blueprint for production dashboards connected to actual hospital KPIs.</p></div></div>`)}
function users(){return shell('Users & RBAC','Scoped access for hospital teams',`<div class="card">${table(['User','Tenant','Clinic','Role'],state.data.memberships.map(m=>{const u=state.data.users.find(x=>x.id===m.userId),t=state.data.tenants.find(x=>x.id===m.tenantId),c=state.data.clinics.find(x=>x.id===m.clinicId);return `<tr><td>${u?.name||m.userId}</td><td>${t?.name||''}</td><td>${c?.name||'Organization'}</td><td><span class="badge">${m.role}</span></td></tr>`}))}</div>`)}
function tenantEnv(){return shell('Tenant & Environment','Demonstrate controlled organizational and deployment context',`<div class="hero"><h2>${esc(state.data.tenants.find(t=>t.id===state.tenantId)?.name||'Tenant')}</h2><p>Environment: <b>${state.env}</b> • Clinic: <b>${esc(state.data.clinics.find(c=>c.id===state.clinicId)?.name||'')}</b> • Role: <b>${state.role}</b></p></div><div class="grid g3" style="margin-top:14px">${metric('Tenants',state.data.tenants.length,'Organization contexts')}${metric('Clinics',state.data.clinics.filter(c=>c.tenantId===state.tenantId).length,'Tenant scope')}${metric('Users',state.data.memberships.filter(m=>m.tenantId===state.tenantId).length,'RBAC memberships')}</div>`)}
function auditPage(){return shell('Audit & Idempotency','Every important state change can be traceable and safely retried',`<div class="grid g2"><div class="card"><h3>Audit trail</h3>${table(['Action','Reference','When'],state.data.audit.filter(a=>a.tenantId===state.tenantId).slice(-10).reverse().map(a=>`<tr><td>${a.action}</td><td>${a.ref}</td><td>${new Date(a.at).toLocaleString()}</td></tr>`))}</div><div class="card"><h3>Idempotency design</h3><p>State-changing requests should use an idempotency key so double-clicks, browser retries or network retries do not create duplicate clinical or financial records.</p><button class="btn primary" onclick="demoIdempotency()">Run duplicate-safe demo</button></div></div>`)}
function demoIdempotency(){const k='DEMO-'+state.tenantId+'-PAY-001';const found=state.data.idempotency.find(x=>x.key===k);if(found){toast('Duplicate request returned existing result')}else{state.data.idempotency.push({key:k,tenantId:state.tenantId,result:'PAYMENT-001'});audit('IDEMPOTENCY_COMMITTED','PAYMENT-001');persist();toast('First request committed once')}}
function quickModal(){openModal('quick')}
function openModal(type){const box=document.getElementById('modalbox');if(type==='quick'){box.innerHTML=`<h2>Quick hospital actions</h2><div class="grid g2"><button class="btn" onclick="go('patients');closeModal()">Register patient</button><button class="btn" onclick="go('appointments');closeModal()">Book appointment</button><button class="btn" onclick="go('billing');closeModal()">Create/collect invoice</button><button class="btn" onclick="go('leads');closeModal()">Add lead</button><button class="btn" onclick="go('reports');closeModal()">Review revenue</button><button class="btn" onclick="go('users');closeModal()">Manage roles</button></div><br><button class="btn" onclick="closeModal()">Close</button>`}document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
const PAGES={
dashboard,patients,profile:profilePage,appointments,
leads:()=>generic('Leads & Follow-ups','Convert inquiries into scheduled care and repeat visits',[['Lead pipeline','Capture source, stage, expected value and next action.','good'],['Follow-up engine','Prioritize overdue callbacks and post-visit engagement.','warn'],['Conversion analytics','Measure lead → booking → visit → repeat journey.','']]),
reviews:()=>generic('Reviews & Engagement','Strengthen reputation and patient relationships',[['Review requests','Trigger review workflows after completed care.','good'],['Campaigns','Coordinate patient communications by service or segment.',''],['Retention','Use follow-up tasks to encourage appropriate return visits.','warn']]),
consultations:()=>generic('Clinical Consultations','Structured clinical workflow',[['Queue context','Open patient context from appointment.','good'],['Clinical notes','Capture structured and narrative consultation data.',''],['Care plan','Link diagnosis, treatment and follow-up.','warn']]),
prescriptions:()=>generic('Prescriptions','Digital prescription workflow',[['Templates','Reusable medicine/instruction templates.','good'],['Safety checks','Role-aware review before issue.','warn'],['Patient copy','Digital document workflow for patient access.','']]),
records:()=>generic('Medical Records','Longitudinal patient record',[['Timeline','Consultations, labs, prescriptions and documents.','good'],['Documents','Central patient document context.',''],['Continuity','Reduce repeated history gathering.','good']]),
labs:()=>generic('Laboratory','Connect diagnostics to patient care',[['Orders','Create lab orders from clinical workflow.',''],['Results','Attach results to patient record.','good'],['Alerts','Flag pending results for follow-up.','warn']]),
tele:()=>generic('Teleconsultation','Extend access beyond physical visits',[['Virtual queue','Schedule and manage remote consultations.','good'],['Consultation context','Patient record available to authorized clinician.',''],['Follow-up','Connect virtual care to prescriptions and next visit.','warn']]),
treatments:()=>generic('Treatments & Packages','Standardize service delivery and package revenue',[['Packages','Bundle services with defined commercial value.','good'],['Treatment plans','Track planned vs completed sessions.',''],['Upsell opportunities','Surface relevant next services without losing clinical context.','warn']]),
documents:()=>generic('Documents & Consents','Digitize operational and patient documentation',[['Consent capture','Track consent status.','good'],['Document vault','Attach and retrieve documents by patient.',''],['Expiry/renewal','Create reminders for expiring documents.','warn']]),
skincare:()=>generic('Skin Care','Specialized workflow demonstration',[['Assessments','Capture structured assessment details.','good'],['Before/after','Link treatment images and milestones.',''],['Plans','Connect packages, sessions and follow-ups.','warn']]),
billing,
orders:()=>generic('Orders & Cart','Commerce workflow connected to patient care',[['Cart','Build patient/service/product orders.','good'],['Checkout','Connect order to invoice/payment.',''],['Order history','Maintain traceable order status.','warn']]),
inventory:()=>generic('Products & Inventory','Reduce stock-outs and improve product visibility',[['Stock','Track stock by clinic.','good'],['Low-stock alerts','Prioritize replenishment.','warn'],['Product sales','Connect product movement to revenue.','']]),
services:()=>generic('Services Catalog','Central service catalogue and pricing',[['Services','Manage services by clinic/organization.','good'],['Packages','Bundle services and commercial rules.',''],['Availability','Align services with provider schedules.','warn']]),
doctors:()=>generic('Doctors & Schedules','Improve provider utilization',[['Schedules','Manage availability and clinic assignment.','good'],['Capacity','See booked vs available slots.','warn'],['Performance','Connect volume and revenue metrics to operational data.','']]),
organizations:()=>generic('Organizations & Clinics','Operate multiple clinics under controlled tenants',[['Tenant hierarchy','Organization → clinics.','good'],['Clinic settings','Scope users, services and operations.',''],['Expansion','Add new locations without duplicating the platform.','good']]),
users,notifications:()=>generic('Notifications','Coordinate patients and staff',[['Reminders','Appointment and follow-up reminders.','good'],['Operational alerts','Queue, lab and payment notifications.','warn'],['Templates','Central communication templates.','']]),
cms:()=>generic('CMS','Turn digital content into an acquisition channel',[['Pages','Manage service and hospital information.','good'],['Articles','Publish educational content.',''],['FAQs','Answer common patient questions.','good']]),
reports,audit:auditPage,tenantEnv
};
function render(){syncContext();const fn=PAGES[state.page]||dashboard;document.getElementById('content').innerHTML=fn();if(state.page==='patients')bindPatientSearch();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
function bindPatientSearch(){const el=document.getElementById('patientSearch');if(!el)return;el.focus();el.setSelectionRange(el.value.length,el.value.length);el.addEventListener('input',e=>{state.query=e.target.value;const body=document.getElementById('patientTable');if(body){const rows=activePatients().filter(x=>!state.query||`${x.name} ${x.phone} ${x.service}`.toLowerCase().includes(state.query.toLowerCase())).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.service)}</td><td>${x.status}</td><td>${money(x.value)}</td><td><button class="btn" onclick="profile('${x.id}')">Profile</button></td></tr>`);body.innerHTML=table(['Patient','Phone','Service','Status','Lifetime value','Action'],rows)}})}
document.getElementById('env').addEventListener('change',e=>{state.env=e.target.value;loadEnv();render()});
document.getElementById('tenant').addEventListener('change',e=>{state.tenantId=e.target.value;state.clinicId=null;loadEnv();render()});
document.getElementById('clinic').addEventListener('change',e=>{state.clinicId=e.target.value;persist();syncContext();render()});
document.getElementById('role').addEventListener('change',e=>{state.role=e.target.value;persist();syncContext();render()});
document.getElementById('globalSearch').addEventListener('input',e=>{state.query=e.target.value;showGlobalResults()});
function showGlobalResults(){const q=state.query.trim().toLowerCase();if(!q){if(state.page==='patients')render();return}const p=activePatients().filter(x=>`${x.name} ${x.phone} ${x.service}`.toLowerCase().includes(q));const a=activeAppointments().filter(x=>`${x.patient} ${x.doctor}`.toLowerCase().includes(q));document.getElementById('content').innerHTML=`<div class="h1">Search results</div><div class="sub">Active tenant: ${esc(state.data.tenants.find(t=>t.id===state.tenantId)?.name||'')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Patients (${p.length})</h3>${table(['Patient','Service','Action'],p.map(x=>`<tr><td>${x.name}</td><td>${x.service}</td><td><button class="btn" onclick="profile('${x.id}')">Open</button></td></tr>`))}</div><div class="card"><h3>Appointments (${a.length})</h3>${table(['Patient','Doctor','Time'],a.map(x=>`<tr><td>${x.patient}</td><td>${x.doctor}</td><td>${x.time}</td></tr>`))}</div></div>`}
function init(){navRender();loadEnv();render()}
init();
</script>
</body>
