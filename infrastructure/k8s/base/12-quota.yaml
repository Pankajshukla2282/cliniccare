# Namespace-level guardrails so a runaway workload can't starve the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: cliniccare
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    count/pods: "20"
    count/services: "10"
---
# Default resource bounds for any container that forgets to set them.
apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: cliniccare
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 200m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 50m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 2Gi